# --- 1. Base de Datos en Memoria (H2) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- 2. Credenciales Falsas de Google (Mocking) ---
spring.security.oauth2.client.registration.google-idp.client-id=test-client-id
spring.security.oauth2.client.registration.google-idp.client-secret=test-client-secret
spring.security.oauth2.client.registration.google-idp.scope=openid,profile,email
spring.security.oauth2.client.registration.google-idp.provider=google
spring.security.oauth2.client.registration.google-idp.client-name=TestApp
spring.security.oauth2.client.provider.google.user-name-attribute=email