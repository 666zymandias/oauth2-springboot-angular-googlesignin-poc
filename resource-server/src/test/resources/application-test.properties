# --- Base de Datos H2 (Modo Compatible MySQL) ---
# MODE=MySQL es crucial para que no falle si usas tipos específicos de MySQL
spring.datasource.url=jdbc:h2:mem:testdb-resource;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Evita validar el esquema al inicio (previene errores de DDL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- Configuración del Sistema ---
# Permite que nuestros Mocks sobrescriban a los beans reales sin quejarse
spring.main.allow-bean-definition-overriding=true

# --- Seguridad ---
# Dejamos esto vacío o con valores dummy inocuos.
# Al usar el @MockBean en el Java, Spring ignorará esto, pero lo ponemos por seguridad.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/dummy