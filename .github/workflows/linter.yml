name: Linter Analysis app

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  authorization-server-analysis:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./authorization-server

    steps:
    - uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Ejecutar Checkstyle y Tests
      env:
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: mvn clean verify checkstyle:check

  resource-server-analysis:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./resource-server

    steps:
    - uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Ejecutar Checkstyle y Tests
      env:
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: mvn clean verify checkstyle:check

  frontend-analysis:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ag-prueba-front

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './ag-prueba-front/package-lock.json'

    - name: Instalar dependencias
      run: npm ci

    - name: Ejecutar Linter Angular
      run: npx ng lint