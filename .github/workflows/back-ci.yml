name: CI - Build backend

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  authorization-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build authorization server
        working-directory: authorization-server
        run: mvn -B package

  resource-server:
    runs-on: ubuntu-latest
    needs: authorization-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build resource server
        working-directory: resource-server
        run: ./mvnw -B package
